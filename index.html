<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos cerca de ti</title>

   <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-movil">
    
    <header class="cabecera">
      <h1>Explorar eventos</h1>
      <button id="btn-abrir-filtros" class="boton-busqueda">
        Buscar o filtrar eventos...
        <span id="icono-flecha">▼</span>
      </button>
    </header>

    <!-- FILTROS -->
    <div id="panel-filtros" class="panel-filtros oculto">
        
        <div class="grupo-filtro">
          <label for="filtro-precio">
            Precio máximo
            <span id="valor-precio">50 €</span>
          </label>
          <input type="range" id="filtro-precio" min="0" max="50" step="5" value="50">
        </div>

        
        <div class="grupo-filtro">
          <label for="filtro-distancia">
            Distancia máxima
            <span id="valor-distancia">10 km</span>
          </label>
          <input type="range" id="filtro-distancia" min="1" max="20" step="1" value="10">
        </div>

       
        <div class="grupo-filtro">
          <label for="filtro-duracion">
            Duración máxima
            <span id="valor-duracion">3 h</span>
          </label>
          <input type="range" id="filtro-duracion" min="0.5" max="5" step="0.5" value="3">
        </div>

        <button id="btn-abrir-filtros" class="boton-busqueda">
        Escoger tipo de evento
        <span id="icono-flecha">▼</span>
        </button>

        <button id="btn-aplicar" class="boton-aplicar" type="button">
          Aplicar filtros
        </button>

      </div>

    <!-- Contenido principal con tarjetas de ejemplo -->
    <main class="lista-eventos">

      <article class="tarjeta" data-precio="15" data-distancia="1.8" data-duracion="2">
        <p class="fecha">Sábado · 19:00</p>
        <h2>Concierto acústico en la terraza</h2>
        <p class="lugar">Centro Cultural · Madrid</p>
        <div class="detalles">
          <span class="dato">15 €</span>
          <span class="dato">1,8 km</span>
          <span class="dato">2 h</span>
        </div>
      </article>

      <article class="tarjeta" data-precio="0" data-distancia="3.2" data-duracion="1.5">
        <p class="fecha">Domingo · 10:30</p>
        <h2>Ruta guiada por el parque</h2>
        <p class="lugar">Parque del Retiro</p>
        <div class="detalles">
          <span class="dato">Gratis</span>
          <span class="dato">3,2 km</span>
          <span class="dato">1,5 h</span>
        </div>
      </article>

      <div id="sin-resultados" class="sin-resultados oculto">
        <p>No hay eventos con esos filtros.</p>
      </div>

    </main>

  </div>
  <script src="script_backend.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
